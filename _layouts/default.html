<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% assign ig = site.data.videos | where_exp: "v", "v.instagram" %}
  {% if ig.size > 0 %}<script async src="https://www.instagram.com/embed.js"></script>{% endif %}
</body>
</html>
